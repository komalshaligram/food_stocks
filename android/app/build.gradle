plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// NDK r28+ builds native libs with 16 KB ELF alignment (Google Play requirement for API 35+).
def ndkVersion16Kb = "28.0.13004108"

android {
    namespace "com.foodstock"
    compileSdk = 36
    ndkVersion ndkVersion16Kb

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }


    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    lintOptions {
        // Code...
        checkReleaseBuilds false
        // Added the above line so that 'flutter build apk' could work
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.foodstock"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 72
        versionName "1.0.58"
    }

    signingConfigs {
        release {
            storeFile file("./Food_Stock")
            storePassword "Sit@321#"
            keyAlias "key0"
            keyPassword "Sit@321#"
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            // signingConfig signingConfigs.debug
            signingConfig signingConfigs.release
        }
    }

    // AGP 8.5.1+: uncompressed .so files are zip-aligned to 16 KB for Play Store / 16 KB devices.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    flavorDimensions "app"
    productFlavors {
        dev {
            dimension "app"
            applicationId "com.foodstock"
            resValue "string", "app_name", "TAVILI DEV"
        }
        prod {
            dimension "app"
            applicationId "com.foodstock.dev" //this is playstore package name
            resValue "string", "app_name", "TAVILI"
        }

    }

}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation platform('com.google.firebase:firebase-bom:30.2.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.smartlook.android:smartlook-analytics:2.3.22'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}